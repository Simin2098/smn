<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="tab-container">
        <div class="tab-header">
            <div class="tab active" onclick="switchTab(0)">First Tab</div>
            <div class="tab" onclick="switchTab(1)">Second Tab</div>
            <div class="tab" onclick="switchTab(2)">Third Tab</div>
            <div class="tab" onclick="switchTab(3)">Fourth Tab</div>
        </div>

        <div class="tab-content active">
            First Tab content to be displayed here.
        </div>
        <div class="tab-content">
            Second Tab content goes here.
        </div>
        <div class="tab-content">
            Third Tab content goes here.
        </div>
        <div class="tab-content">
            Fourth Tab content goes here.
        </div>
    </div>

</body>
</html>
